{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sticky Notes{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'note/styles.css' %}" />
  </head>
  <body>
    <header>
      <h1><a href="{% url 'note_list' %}">Sticky Notes</a></h1>
      <a class="button" href="{% url 'note_create' %}">+ New note</a>
    </header>
    <main>
      {% block content %}{% endblock content %}
    </main>
    <footer>
      <p>Sticky Notes - built with Django</p>
    </footer>
  </body>
</html>
