{% extends 'base.html' %}
{% block title %}Sticky Notes - {% if form.instance.pk %}Edit{% else %}New{% endif %} note{% endblock %}
{% block content %}
  <h2>{% if form.instance.pk %}Edit{% else %}New{% endif %} note</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'note_list' %}">Cancel</a>
  </form>
{% endblock %}
