{% extends 'base.html' %}
{% block title %}Sticky Notes - Delete note{% endblock %}
{% block content %}
  <h2>Delete "{{ note.title }}"?</h2>
  <p>This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="danger">Yes, delete</button>
    <a href="{% url 'note_list' %}">Cancel</a>
  </form>
{% endblock %}
